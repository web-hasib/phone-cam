name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Dependencies
        working-directory: ./mobile
        run: npm install

      - name: ⚙️ Prebuild Native Android Project
        working-directory: ./mobile
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Build Installable Android APK
        working-directory: ./mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: 📁 Rename Output APK
        run: |
          mkdir -p build-output
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk build-output/PhoneCam.apk

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneCam-Android-APK
          path: build-output/PhoneCam.apk
          retention-days: 30

      - name: 🚀 Release APK on GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/PhoneCam.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
